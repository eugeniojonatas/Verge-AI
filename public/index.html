<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Verge</h1>
      <span id="api-status" class="status-pill">Verificando IA...</span>
    </header>

    <section id="setup-panel" class="card">
      <h2>Defina o seu Universo</h2>
      <p class="subtitle">Escolha livremente qualquer cenário, temática e o papel do seu personagem.</p>

      <form id="setup-form">
        <div class="form-group">
          <label for="theme-input">Temática & Cenário:</label>
          <textarea 
            id="theme-input" 
            rows="2" 
            placeholder="Ex: Cyberpunk distópico em Neo-Tóquio subterrânea; Faroeste cósmico; Horror gótico vitoriano..." 
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="char-input">Seu Personagem / Papel:</label>
          <input 
            type="text" 
            id="char-input" 
            placeholder="Ex: Ex-investigador cibernético com implantes defeituosos" 
            required
          />
        </div>

        <div class="form-group">
          <label for="rules-input">Estilo & Regras:</label>
          <input 
            type="text" 
            id="rules-input" 
            placeholder="Ex: Narrativo e investigativo, foco em decisões morais difíceis" 
            value="Narrativo dinâmico, consequências realistas às ações"
          />
        </div>

        <button type="submit" id="btn-start" class="btn primary">
          Gerar Mundo & Iniciar Aventura
        </button>
      </form>
    </section>

    <section id="game-panel" class="card hidden">
      <div class="game-meta">
        <div>
          <strong id="active-theme-label">Cenário:</strong>
          <span id="active-char-label" class="dim"></span>
        </div>
        <button type="button" id="btn-reset" class="btn small">Novo Mundo</button>
      </div>

      <div id="chat-box" class="chat-box"></div>

      <div id="loading-indicator" class="loading hidden">
        <span>O Mestre está tecendo a narrativa...</span>
      </div>

      <form id="action-form" class="action-form">
        <input 
          type="text" 
          id="action-input" 
          placeholder="O que você faz agora?" 
          autocomplete="off"
        />
        <button type="submit" id="btn-send" class="btn primary">Enviar</button>
      </form>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
